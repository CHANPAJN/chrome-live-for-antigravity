<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Live View</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --panel: #ffffff;
        --stage: #f1f5f9;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
        --ok: #10b981;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0e13;
          --panel: #151922;
          --stage: #0f1219;
          --border: #262c3a;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --accent: #0ea5e9;
          --ok: #10b981;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font: 400 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .dot-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #94a3b8;
        flex-shrink: 0;
      }
      .dot[data-on="true"] {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
      }
      .title-text {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 10px;
        background: var(--stage);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: 9px 9px 0 0;
      }
      .url-label {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      button {
        font: 500 11.5px/1 inherit;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .stage {
        background: var(--stage);
        border: 1px solid var(--border);
        border-radius: 0 0 9px 9px;
        overflow: hidden;
        min-height: 240px;
        display: grid;
        place-items: center;
      }
      .stage img {
        width: 100%;
        height: auto;
        display: none;
      }
      .empty {
        padding: 32px 18px;
        text-align: center;
        color: var(--muted);
        max-width: 360px;
      }
      .primary-btn {
        margin-top: 10px;
        width: 100%;
        padding: 9px 12px;
        font-size: 12.5px;
        font-weight: 600;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <div class="dot-wrap">
          <span class="dot" id="led"></span>
          <span class="title-text" id="statusTitle">Connecting...</span>
        </div>
        <span id="tabBadge" style="font-size: 11.5px; color: var(--muted)">0 tabs</span>
      </div>

      <div class="toolbar">
        <span class="url-label" id="urlLabel">127.0.0.1:28196</span>
        <div class="btn-group">
          <button type="button" id="refreshBtn">Refresh</button>
          <button type="button" id="releaseBtn">Release</button>
        </div>
      </div>

      <div class="stage">
        <img id="liveImg" alt="Live browser preview" />
        <div class="empty" id="emptyMsg"></div>
      </div>

      <button type="button" class="primary-btn" id="focusBtn" disabled>Focus Controlled Tab</button>
    </div>

    <script>
      (() => {
        const IS_ZH = /^zh\b/i.test(navigator.language || '');
        const TXT = IS_ZH
          ? {
              waking: '正在唤醒本地 28196 桥接服务...',
              extOffline: '等待 Chrome 扩展连接（在 chrome://extensions 点一下重新加载 ↻）',
              connectedIdle: '主 Chrome 已在线 · 按 Alt+Shift+L 共享标签页或直接发任务',
              emptyHint: '已连接主 Chrome！即使浏览器最小化收在任务栏，执行网页任务时也会在此实时同步画面。',
              refresh: '刷新画面',
              release: '释放',
              focusTab: '切换到受控标签页',
              tabsSuffix: '个受控页'
            }
          : {
              waking: 'Starting local bridge on port 28196...',
              extOffline: 'Waiting for Chrome extension (click Reload ↻ in chrome://extensions)',
              connectedIdle: 'Chrome Connected · Press Alt+Shift+L to share a tab',
              emptyHint: 'Connected to Chrome! Live screencast frames appear here automatically during tasks.',
              refresh: 'Refresh',
              release: 'Release',
              focusTab: 'Focus Controlled Tab',
              tabsSuffix: 'tabs'
            };

        const led = document.getElementById('led');
        const statusTitle = document.getElementById('statusTitle');
        const tabBadge = document.getElementById('tabBadge');
        const urlLabel = document.getElementById('urlLabel');
        const liveImg = document.getElementById('liveImg');
        const emptyMsg = document.getElementById('emptyMsg');
        const refreshBtn = document.getElementById('refreshBtn');
        const releaseBtn = document.getElementById('releaseBtn');
        const focusBtn = document.getElementById('focusBtn');

        refreshBtn.textContent = TXT.refresh;
        releaseBtn.textContent = TXT.release;
        focusBtn.textContent = TXT.focusTab;
        emptyMsg.textContent = TXT.waking;

        let lastCapturedAt = 0;
        let activeTabId = null;
        let pinnedTabId = null;
        let pinnedTabClosed = false;
        let pollInFlight = false;

        const sidecarFetch = (route, opts = {}) => {
          const fn =
            window.sidecar && typeof window.sidecar.fetch === 'function'
              ? window.sidecar.fetch.bind(window.sidecar)
              : fetch;
          return fn(route, { cache: 'no-store', ...opts });
        };

        async function poll(forceFrame = false) {
          if (document.hidden || pollInFlight) return;
          pollInFlight = true;
          try {
            // Lightweight metadata poll first; fetch Base64 JPEG only when a newer frame exists!
            const resp = await sidecarFetch(
              forceFrame ? '/api/live_state?includeFrame=1' : '/api/live_state?includeFrame=0'
            );
            const s = await resp.json();
            if (!s || s.daemonOffline) {
              led.dataset.on = 'false';
              statusTitle.textContent = TXT.waking;
              emptyMsg.textContent = TXT.waking;
              liveImg.style.display = 'none';
              emptyMsg.style.display = 'block';
              focusBtn.disabled = true;
              return;
            }

            const connected = Boolean(s.extensionConnected);
            led.dataset.on = String(connected);
            const tabs = Array.isArray(s.tabs) ? s.tabs : [];
            tabBadge.textContent = `${tabs.length} ${TXT.tabsSuffix}`;

            if (!connected) {
              statusTitle.textContent = TXT.extOffline;
              emptyMsg.textContent = TXT.extOffline;
              liveImg.style.display = 'none';
              emptyMsg.style.display = 'block';
              focusBtn.disabled = true;
              return;
            }

            let target = null;
            if (pinnedTabId !== null) {
              target = tabs.find((t) => t.tabId === pinnedTabId) || null;
              pinnedTabClosed = target === null;
            } else if (!pinnedTabClosed) {
              target = tabs.find((t) => t.substate === 'shared') || tabs[0] || null;
              pinnedTabId = target ? target.tabId : null;
            }
            activeTabId = target ? target.tabId : null;
            focusBtn.disabled = activeTabId === null || Boolean(target && target.paused);

            if (!target) {
              lastCapturedAt = 0;
              statusTitle.textContent = TXT.connectedIdle;
              urlLabel.textContent = '127.0.0.1:28196';
              liveImg.removeAttribute('src');
              liveImg.style.display = 'none';
              emptyMsg.textContent =
                pinnedTabClosed && tabs.length > 0
                  ? (IS_ZH ? '原监控页已关闭或释放' : 'Watched tab was closed or released')
                  : TXT.emptyHint;
              emptyMsg.style.display = 'block';
              return;
            }

            statusTitle.textContent = target.activity || TXT.connectedIdle;
            urlLabel.textContent = target.url || target.title || '127.0.0.1:28196';

            if (target.paused) {
              lastCapturedAt = 0;
              liveImg.removeAttribute('src');
              liveImg.style.display = 'none';
              emptyMsg.textContent = IS_ZH
                ? '已暂停 · 人工接管期间画面流已停止'
                : 'Paused · Stream stopped during manual control';
              emptyMsg.style.display = 'block';
              return;
            }

            const remoteTs = s.latestFrameMeta?.capturedAt || 0;
            if (remoteTs && (remoteTs !== lastCapturedAt || forceFrame)) {
              const frameResp = await sidecarFetch(
                `/api/live_state?includeFrame=1&tabId=${encodeURIComponent(activeTabId)}`
              );
              const frameJson = await frameResp.json();
              const dataUrl =
                frameJson?.frameTabId === activeTabId ? frameJson?.frameDataUrl || '' : '';
              if (dataUrl) {
                lastCapturedAt = remoteTs;
                liveImg.src = dataUrl;
                liveImg.style.display = 'block';
                emptyMsg.style.display = 'none';
              }
            } else if (!lastCapturedAt) {
              emptyMsg.textContent = TXT.emptyHint;
            }
          } catch {
          } finally {
            pollInFlight = false;
          }
        }

        refreshBtn.addEventListener('click', async () => {
          if (activeTabId === null) return;
          const r = await sidecarFetch(`/api/action?cmd=screenshot&tabId=${encodeURIComponent(activeTabId)}`).catch(
            () => null
          );
          const j = r ? await r.json().catch(() => null) : null;
          if (!j || j.ok === false) {
            statusTitle.textContent = j?.error || 'Refresh failed';
            return;
          }
          await poll(true);
        });

        releaseBtn.addEventListener('click', async () => {
          if (activeTabId === null) return;
          const r = await sidecarFetch(`/api/action?cmd=release_tab&tabId=${encodeURIComponent(activeTabId)}`).catch(
            () => null
          );
          const j = r ? await r.json().catch(() => null) : null;
          if (!j || j.ok === false) {
            statusTitle.textContent = j?.error || 'Release failed';
            return;
          }
          lastCapturedAt = 0;
          liveImg.style.display = 'none';
          emptyMsg.style.display = 'block';
          await poll();
        });

        focusBtn.addEventListener('click', async () => {
          if (activeTabId !== null) {
            await sidecarFetch(`/api/action?cmd=focus_tab&tabId=${encodeURIComponent(activeTabId)}`).catch(() => {});
          }
        });

        setInterval(poll, 1200);
        poll();
      })();
    </script>
  </body>
</html>
