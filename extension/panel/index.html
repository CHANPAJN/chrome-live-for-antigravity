<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Live</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-cluster">
          <span class="conn-dot" id="connDot" data-connected="false"></span>
          <div class="brand-meta">
            <div class="brand-title-row">
              <span class="brand-name">Chrome Live</span>
              <span class="port-chip" id="portChip">127.0.0.1:28196</span>
            </div>
            <p class="conn-sub" id="connSubText">...</p>
          </div>
        </div>
        <div class="top-tools">
          <button type="button" class="icon-pill" id="langBtn" title="切换中英文 / Switch Language">
            EN
          </button>
          <button type="button" class="icon-btn" id="reconnectBtn" title="重新连接本地守护服务">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>
        </div>
      </header>

      <nav class="seg-nav" role="tablist">
        <button type="button" class="seg-tab" role="tab" data-tab="console" aria-selected="true" id="navConsole">
          操控台
        </button>
        <button type="button" class="seg-tab" role="tab" data-tab="playbooks" aria-selected="false" id="navPlaybooks">
          <span id="navPlaybooksLabel">直达路书</span>
          <span class="seg-count" id="navPlaybooksCount">0</span>
        </button>
        <button type="button" class="seg-tab" role="tab" data-tab="settings" aria-selected="false" id="navSettings">
          配对与护栏
        </button>
      </nav>

      <main class="pane-scroll">
        <!-- TAB 1: CONSOLE -->
        <section class="tab-pane" id="paneConsole" data-active="true">
          <div class="surface-card hero-card">
            <div class="current-page-row">
              <svg class="page-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2.5" />
                <line x1="3" y1="9" x2="21" y2="9" />
              </svg>
              <div class="current-page-meta">
                <div class="current-page-title" id="curTabTitle">...</div>
                <div class="current-page-host" id="curTabHost">...</div>
              </div>
            </div>

            <button type="button" class="primary-cta" id="primaryShareBtn">
              <span id="primaryShareLabel">共享当前标签页</span>
              <kbd class="cta-kbd">Alt+Shift+L</kbd>
            </button>
            <p class="micro-note" id="lockGestureNote"></p>
          </div>

          <div class="section-block">
            <div class="section-head">
              <span class="section-title" id="managedSectionTitle">受控与已共享标签页</span>
              <div class="section-actions">
                <span class="num-badge" id="managedCountBadge">0</span>
                <button type="button" class="text-danger-btn hidden" id="releaseAllBtn">全部释放</button>
              </div>
            </div>
            <ul class="item-list" id="managedTabList"></ul>
          </div>

          <div class="section-block">
            <div class="section-head">
              <span class="section-title" id="auditSectionTitle">实时动作流水</span>
              <button type="button" class="text-muted-btn" id="clearAuditBtn">清空</button>
            </div>
            <ul class="audit-stream" id="auditList"></ul>
          </div>
        </section>

        <!-- TAB 2: PLAYBOOKS -->
        <section class="tab-pane" id="panePlaybooks" data-active="false">
          <div class="surface-card">
            <div class="switch-row">
              <div class="switch-copy">
                <div class="card-title" id="pbToggleTitle">本地路书自动记忆</div>
                <p class="card-desc" id="pbToggleDesc"></p>
              </div>
              <button
                type="button"
                class="toggle-switch"
                role="switch"
                aria-checked="false"
                id="pbSwitchBtn"
              >
                <span class="toggle-thumb"></span>
              </button>
            </div>
          </div>

          <div class="surface-card">
            <div class="card-head-inline">
              <span class="card-title" id="pbQuickAddTitle">添加站点路书</span>
              <div class="mini-type-tabs" role="tablist">
                <button type="button" class="mini-type-btn" data-pbtype="route" aria-selected="true" id="pbTypeRoute">
                  捷径
                </button>
                <button type="button" class="mini-type-btn" data-pbtype="tip" aria-selected="false" id="pbTypeTip">
                  提示
                </button>
                <button type="button" class="mini-type-btn" data-pbtype="selector" aria-selected="false" id="pbTypeSelector">
                  定位
                </button>
              </div>
            </div>
            <div class="quick-tip-form">
              <input type="text" class="field-input" id="pbDomainInput" placeholder="example.com" />
              <input type="text" class="field-input" id="pbKeyInput" placeholder="捷径名称（如：待发货订单）" />
              <input
                type="text"
                class="field-input"
                id="pbTipInput"
                placeholder="https://example.com/admin/orders"
              />
              <button type="button" class="secondary-btn full-w" id="pbAddTipBtn">保存到本地路书</button>
            </div>
          </div>

          <div class="section-block">
            <div class="section-head">
              <span class="section-title" id="pbSavedTitle">已沉淀站点路由</span>
              <button type="button" class="text-danger-btn" id="pbClearAllBtn">清空全部</button>
            </div>
            <div class="pb-site-list" id="pbSiteList"></div>
          </div>
        </section>

        <!-- TAB 3: SETTINGS & GUARDRAILS -->
        <section class="tab-pane" id="paneSettings" data-active="false">
          <div class="surface-card">
            <div class="card-head-inline">
              <span class="card-title" id="pairCardTitle">本地守护进程配对</span>
              <button type="button" class="text-muted-btn" id="resetPortBtn">默认 28196</button>
            </div>

            <label class="field-label" for="portInput" id="portFieldLabel">监听端口 (127.0.0.1)</label>
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              id="portInput"
              class="field-input mono-num"
              value="28196"
              autocomplete="off"
            />

            <label class="field-label" for="tokenInput" id="tokenFieldLabel">本地配对口令 (Token)</label>
            <div class="input-with-tools">
              <input
                type="password"
                id="tokenInput"
                class="field-input mono-num"
                placeholder="chrome-live token"
                autocomplete="off"
              />
              <button type="button" class="inline-tool-btn" id="toggleTokenVisBtn" title="显示/隐藏口令">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
              <button type="button" class="inline-tool-btn" id="copyTokenBtn" title="复制口令">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
              </button>
            </div>

            <button type="button" class="secondary-btn full-w mt-10" id="savePairingBtn">
              保存配对并重连
            </button>
          </div>

          <div class="surface-card">
            <div class="card-head-inline">
              <span class="card-title" id="guardCardTitle">金融与收银台硬护栏</span>
              <span class="status-pill-ok" id="guardAlwaysBadge">常驻保护</span>
            </div>
            <p class="card-desc" id="guardCardDesc"></p>

            <div class="chip-cloud" id="builtinGuardChips">
              <span class="guard-chip">Alipay / 支付宝</span>
              <span class="guard-chip">WeChat Pay</span>
              <span class="guard-chip">Stripe / PayPal</span>
              <span class="guard-chip">主流网银</span>
              <span class="guard-chip">/checkout 收银路径</span>
              <span class="guard-chip">AWS / GCP / Azure 账单</span>
            </div>

            <label class="field-label" for="customDomainsInput" id="customGuardLabel">
              自定义额外拦截域名（每行一个）
            </label>
            <textarea
              id="customDomainsInput"
              class="field-textarea mono-num"
              rows="3"
              placeholder="erp.internal.company.com"
            ></textarea>
            <button type="button" class="secondary-btn full-w mt-10" id="saveGuardBtn">
              更新自定义拦截名单
            </button>
          </div>
        </section>
      </main>

      <div class="toast-bar" id="toastBar" data-shown="false"></div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
